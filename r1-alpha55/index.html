<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#075985">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Metrogestión">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://aemoouldgguyjsxrfuwo.supabase.co wss://aemoouldgguyjsxrfuwo.supabase.co; img-src 'self' data: blob: https://aemoouldgguyjsxrfuwo.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'; upgrade-insecure-requests">
  <title>Metrogestión</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../r1-alpha22/icon-metrogestion.svg">
  <link rel="shortcut icon" href="../r1-alpha22/icon-metrogestion.svg">
  <link rel="apple-touch-icon" href="../r1-alpha22/icon-metrogestion.svg">
  <link rel="stylesheet" href="../r1-alpha17/app.css">
  <link rel="stylesheet" href="../r1-alpha17/bootstrap.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-editor.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-card-stages.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-import-preview.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-transformation-preview.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-manual-review.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-visual-preview.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-reservas.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-active.css">
  <link rel="stylesheet" href="../r1-alpha51/hotel-native.css">
  <link rel="stylesheet" href="../r1-alpha52/panel-native.css">
  <link rel="stylesheet" href="../r1-alpha53/hotel-documents.css">
  <link rel="stylesheet" href="../r1-alpha54/hotel-search.css">
  <link rel="stylesheet" href="./document-drop.css">
  <style>
    .app-header{align-items:center;gap:18px}.brand-wrap{display:flex;align-items:center;gap:14px;min-width:0}.brand-symbol{display:block;width:72px;height:72px;object-fit:contain;border-radius:16px;background:#fff;padding:5px;box-sizing:border-box;flex:0 0 auto}.brand-copy{min-width:0}.brand-copy .eyebrow{margin:0 0 2px}.brand-copy h1{margin:0;line-height:1.05}.login-brand{display:flex;justify-content:center;margin:0 auto 18px}.login-logo{display:block;width:min(100%,320px);height:auto;object-fit:contain}@media(max-width:640px){.app-header{gap:10px}.brand-wrap{gap:9px}.brand-symbol{width:54px;height:54px;border-radius:12px;padding:4px}.brand-copy h1{font-size:1.55rem}.brand-copy .eyebrow{font-size:.72rem}.login-logo{width:min(100%,280px)}}
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="app-header">
      <div class="brand-wrap">
        <img class="brand-symbol" src="../r1-alpha22/icon-metrogestion.svg" alt="Metrogestión">
        <div class="brand-copy"><p class="eyebrow">Gestión de mantenimiento</p><h1>Metrogestión</h1></div>
      </div>
      <div class="version-box"><span>Versión</span><strong id="app-version">—</strong></div>
    </header>
    <section id="bootstrap-view" class="auth-card bootstrap-card hidden">
      <div><p class="eyebrow">Activación inicial · solo una vez</p><h2>Crear administrador de pruebas</h2></div>
      <label>Código de activación<input id="bootstrap-code" type="text"></label>
      <label>Nueva contraseña de pruebas<input id="bootstrap-password" type="password"></label>
      <label>Repite la contraseña<input id="bootstrap-password-confirm" type="password"></label>
      <button id="bootstrap-button" class="button primary" type="button">Crear administrador de pruebas</button>
      <p id="bootstrap-message" class="status-message"></p>
    </section>
    <section id="login-view" class="auth-card">
      <div class="login-brand"><img class="login-logo" src="../r1-alpha22/logo-full.svg" alt="Gestión de mantenimiento · Metrogestión"></div>
      <div><p class="eyebrow">Acceso seguro</p><h2>Identificación</h2><p class="muted">El acceso se valida contra Supabase y el dispositivo autorizado.</p></div>
      <label>Correo<input id="login-email" type="email" autocomplete="username"></label>
      <label>Contraseña o PIN<input id="login-password" type="password" autocomplete="current-password"></label>
      <button id="login-button" class="button primary" type="button">Entrar</button>
      <p id="login-message" class="status-message"></p>
    </section>
    <section id="pending-device-view" class="auth-card hidden">
      <div><p class="eyebrow">Dispositivo pendiente</p><h2>Esperando autorización</h2><p id="pending-device-message" class="muted"></p></div>
      <button id="pending-logout-button" class="button secondary">Cerrar sesión</button>
    </section>
    <section id="app-view" class="hidden">
      <div class="session-bar">
        <div><strong id="session-name">—</strong><span id="session-role" class="muted">—</span></div>
        <div class="session-actions"><span id="security-indicator" class="security-indicator">Verificando…</span><button id="logout-button" class="button secondary compact">Cerrar sesión</button></div>
      </div>
      <nav id="module-nav" class="module-nav"></nav>
      <section id="module-content" class="module-content"></section>
    </section>
  </main>
  <script type="module" src="../r1-alpha17/src/bootstrap.js"></script>
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/hotel-native.js"></script>
  <script type="module" src="./src/history-native.js"></script>
  <script type="module" src="../r1-alpha52/src/panel-native.js"></script>
</body>
</html>
