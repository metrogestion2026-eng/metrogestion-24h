<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#075985">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Metrogestión">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://aemoouldgguyjsxrfuwo.supabase.co wss://aemoouldgguyjsxrfuwo.supabase.co; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'; upgrade-insecure-requests">
  <title>Metrogestión</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../r1-alpha18/logo-metrogestion.svg">
  <link rel="shortcut icon" href="../r1-alpha18/logo-metrogestion.svg">
  <link rel="apple-touch-icon" href="../r1-alpha18/logo-metrogestion.svg">
  <link rel="stylesheet" href="../r1-alpha17/app.css">
  <link rel="stylesheet" href="../r1-alpha17/bootstrap.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-editor.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-card-stages.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-import-preview.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-transformation-preview.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-manual-review.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-visual-preview.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-reservas.css">
  <link rel="stylesheet" href="../r1-alpha17/hotel-active.css">
  <style>
    .brand-wrap{display:flex;align-items:center;gap:14px}
    .brand-logo{display:block;width:92px;height:auto;max-height:78px;object-fit:contain}
    .app-header{align-items:center}
    .login-brand{display:flex;justify-content:center;margin:0 0 18px}
    .login-logo{display:block;width:150px;height:auto;max-height:132px;object-fit:contain}
    @media(max-width:640px){
      .brand-logo{width:76px;max-height:66px}
      .brand-wrap{gap:10px}
      .login-logo{width:128px;max-height:112px}
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="app-header">
      <div class="brand-wrap">
        <img class="brand-logo" src="../r1-alpha18/logo-metrogestion.svg" alt="Metrogestión · Gestor de Mantenimiento">
        <div>
          <p class="eyebrow">Gestión de mantenimiento</p>
          <h1>Metrogestión</h1>
        </div>
      </div>
      <div class="version-box"><span>Versión</span><strong id="app-version">—</strong></div>
    </header>

    <section id="bootstrap-view" class="auth-card bootstrap-card hidden">
      <div>
        <p class="eyebrow">Activación inicial · solo una vez</p>
        <h2>Crear administrador de pruebas</h2>
      </div>
      <label>Código de activación<input id="bootstrap-code" type="text"></label>
      <label>Nueva contraseña de pruebas<input id="bootstrap-password" type="password"></label>
      <label>Repite la contraseña<input id="bootstrap-password-confirm" type="password"></label>
      <button id="bootstrap-button" class="button primary" type="button">Crear administrador de pruebas</button>
      <p id="bootstrap-message" class="status-message"></p>
    </section>

    <section id="login-view" class="auth-card">
      <div class="login-brand">
        <img class="login-logo" src="../r1-alpha18/logo-metrogestion.svg" alt="Metrogestión · Gestor de Mantenimiento">
      </div>
      <div>
        <p class="eyebrow">Acceso seguro</p>
        <h2>Identificación</h2>
        <p class="muted">El acceso se valida contra Supabase y el dispositivo autorizado.</p>
      </div>
      <label>Correo<input id="login-email" type="email" autocomplete="username"></label>
      <label>Contraseña o PIN<input id="login-password" type="password" autocomplete="current-password"></label>
      <button id="login-button" class="button primary" type="button">Entrar</button>
      <p id="login-message" class="status-message"></p>
    </section>

    <section id="pending-device-view" class="auth-card hidden">
      <div>
        <p class="eyebrow">Dispositivo pendiente</p>
        <h2>Esperando autorización</h2>
        <p id="pending-device-message" class="muted"></p>
      </div>
      <button id="pending-logout-button" class="button secondary">Cerrar sesión</button>
    </section>

    <section id="app-view" class="hidden">
      <div class="session-bar">
        <div>
          <strong id="session-name">—</strong>
          <span id="session-role" class="muted">—</span>
        </div>
        <div class="session-actions">
          <span id="security-indicator" class="security-indicator">Verificando…</span>
          <button id="logout-button" class="button secondary compact">Cerrar sesión</button>
        </div>
      </div>
      <nav id="module-nav" class="module-nav"></nav>
      <section id="module-content" class="module-content"></section>
    </section>
  </main>

  <script type="module" src="../r1-alpha17/src/bootstrap.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
