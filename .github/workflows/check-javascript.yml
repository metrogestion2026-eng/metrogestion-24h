name: Comprobar seguridad y JavaScript

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Evitar datos operativos en el repositorio publico
        run: python3 .github/scripts/check-public-privacy.py
      - name: Comprobar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find r1-alpha* shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Comprobar sesiones, entradas y segundo factor
        run: node --test tests/security-*.test.mjs
      - name: Comprobar paradas de vehículos externos y reintentos
        run: node --test tests/alpha75-paradas-externas.test.mjs
      - name: Comprobar fechas y navegación del asistente 24H
        run: node --test tests/alpha75-24h-wizard-close.test.mjs
      - name: Comprobar exclusión de archivos internos y páginas antiguas
        run: python3 tests/pages-public-files.test.py
      - name: Verificar compilación pública
        run: python3 .github/scripts/build-pages.py _site
