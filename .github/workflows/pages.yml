name: Publicar Metrogestion 24H

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar solo archivos públicos de la app
        run: python3 .github/scripts/build-pages.py _site
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
