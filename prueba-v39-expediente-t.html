<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metrogestión v39 · Expediente T</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:14px}.head{background:#075985;color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}.card{background:#fff;border:1px solid #d8e1ea;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 3px 14px rgba(15,23,42,.06)}button,input,select,textarea{font:inherit}button{border:1px solid #94a3b8;border-radius:10px;padding:10px 12px;background:#fff;font-weight:750;cursor:pointer}.primary{background:#075985;color:#fff;border-color:#075985}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800}.stage,.docrow{display:flex;gap:10px;align-items:center;justify-content:space-between}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;z-index:1000;padding:12px;overflow:auto}.modal.open{display:block}.sheet{max-width:820px;margin:2vh auto;background:white;border-radius:16px;padding:16px}.section{border-top:1px solid #e2e8f0;padding-top:12px;margin-top:12px}.form{display:grid;gap:9px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid #aebdca;border-radius:9px}.error{background:#fff1f2;border-color:#ef4444;color:#991b1b}.ok{background:#ecfdf3;border-color:#86efac;color:#166534}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.stage,.docrow{align-items:flex-start;flex-direction:column}.stage button,.docrow button{width:100%}}
</style>
</head><body><main class="wrap">
<header class="head"><strong style="font-size:21px">🏨 Metrogestión v39 · Expediente T</strong><div style="opacity:.85;margin-top:4px">Prueba aislada. Lectores consultan; editores además pueden adjuntar documentos y fotos.</div></header>
<div id="status" class="card">Comprobando sesión…</div><div id="list"></div>
</main>
<div id="modal" class="modal"><div class="sheet"><div class="stage"><div><strong id="modal-title" style="font-size:21px">Expediente T</strong><div id="modal-sub" class="muted"></div></div><button id="close">Cerrar</button></div><div id="dossier"></div></div></div>
<script type="module">
import {createHotelStageDossierApi} from './hotel-v39-expediente.js';

const sb=supabase.createClient('https://njtohfkqjjoavtumtmza.supabase.co','sb_publishable_w1a9DClOM0S4HVJdv_TbKg_W_UkN2W_');
const api=createHotelStageDossierApi(sb);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString('es-ES',{timeZone:'Europe/Madrid'}):'—';
const status=$('#status'),list=$('#list'),modal=$('#modal'),dossier=$('#dossier');
let permissions={canView:false,canEdit:false},currentStageId='',currentStopNumber='';
$('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};

const {data:{session}}=await sb.auth.getSession();
if(!session){status.className='card error';status.innerHTML='<strong>Sin sesión Supabase activa.</strong><div class="muted">Abre Metrogestión, inicia sesión y vuelve a esta prueba.</div>';throw new Error('Sin sesión');}
try{permissions=await api.getPermissions();}catch(error){status.className='card error';status.textContent='No se pudieron comprobar permisos: '+error.message;throw error;}
if(!permissions.canView){status.className='card error';status.textContent='Tu usuario no tiene permiso de lectura del Hotel.';throw new Error('Sin permiso');}

const openDocument=async doc=>{
  try{const url=await api.getSignedDocumentUrl(doc);window.open(url,'_blank','noopener,noreferrer');}
  catch(error){alert('No se pudo abrir el documento: '+error.message);}
};

const renderWorks=works=>works.length?works.map(w=>'<div class="card"><strong>'+esc(w.codigo||w.tipo||'Trabajo')+'</strong>'+(w.descripcion||w.motivo_entrada?'<div>'+esc(w.descripcion||w.motivo_entrada)+'</div>':'')+(w.diagnostico_real?'<div><strong>Diagnóstico:</strong> '+esc(w.diagnostico_real)+'</div>':'')+(w.expediente?'<div>Expediente: <strong>'+esc(w.expediente)+'</strong></div>':'')+(w.km||w.km_averia?'<div>Km: <strong>'+esc(w.km||w.km_averia)+'</strong></div>':'')+'</div>').join(''):'<div class="muted">Sin trabajos detallados.</div>';

const renderDocuments=docs=>docs.length?docs.map((x,i)=>'<div class="card docrow"><div><strong>'+(String(x.mime_type||'').startsWith('image/')?'📷 ':'📄 ')+esc(x.nombre_mostrado||x.nombre_original||'Documento')+'</strong><div class="muted">'+esc(x.categoria||'documento')+(x.subcategoria?' · '+esc(x.subcategoria):'')+(x.fecha_documento?' · '+esc(x.fecha_documento):'')+'</div><div class="muted">'+esc(x.descripcion||'')+'</div></div><button class="open-doc primary" data-index="'+i+'">Abrir</button></div>').join(''):'<div class="muted">Sin documentos asociados.</div>';

const loadDossier=async stageId=>{
  const data=await api.getDossier(stageId),e=data.etapa||{},p=data.parada||{};
  currentStageId=stageId;currentStopNumber=p.numero_parada||'';
  const works=[...(data.trabajos||[]),...(data.trabajos_legacy||[])],orders=data.ordenes||[],mails=data.envios||[],docs=data.documentos||[];
  $('#modal-title').textContent=(e.posicion||'?')+'T · '+(e.nombre||'Etapa');
  $('#modal-sub').textContent='Parada '+(p.numero_parada||'—')+' · '+(p.vehiculo_sustituido||('Reserva '+(p.vehiculo_reserva||'—')));
  dossier.innerHTML='<div class="grid section"><div><span class="muted">Estado</span><br><strong>'+esc(e.estado||'—')+'</strong></div><div><span class="muted">Taller / centro</span><br><strong>'+esc(e.taller_nombre||e.lugar||'—')+'</strong>'+(e.centro_nombre?'<div>'+esc(e.centro_nombre)+'</div>':'')+'</div><div><span class="muted">Programada</span><br><strong>'+esc(fmt(e.fecha_prevista))+'</strong></div><div><span class="muted">Inicio real</span><br><strong>'+esc(fmt(e.fecha_inicio_real))+'</strong></div><div><span class="muted">Final real</span><br><strong>'+esc(fmt(e.fecha_fin_real||e.fecha_real))+'</strong></div><div><span class="muted">UPC</span><br><strong>'+esc(p.upc||'—')+'</strong></div><div><span class="muted">INC</span><br><strong>'+esc(p.incidencia||'—')+'</strong></div><div><span class="muted">Prioridad</span><br><strong>'+esc(p.prioridad??'—')+'</strong></div></div><section class="section"><h3>🔧 Trabajos</h3>'+renderWorks(works)+'</section><section class="section"><h3>📄 Pedidos / OR</h3>'+(orders.length?orders.map(o=>'<div class="card">Pedido <strong>'+esc(o.numero_pedido||'—')+'</strong> · OR <strong>'+esc(o.numero_or||'—')+'</strong><div class="muted">'+esc(o.observaciones||'')+'</div></div>').join(''):'<div class="muted">Sin pedido u OR asociados.</div>')+'</section><section class="section"><h3>📷 Documentos y fotos</h3><div id="docs-list">'+renderDocuments(docs)+'</div>'+(permissions.canEdit?'<div class="card form" style="border:2px solid #075985"><strong>Adjuntar a esta T</strong><input id="upload-file" type="file" accept="image/*,.pdf,application/pdf"><select id="upload-category"><option value="foto">Foto</option><option value="hoja_taller">Hoja de taller / OR</option><option value="pedido">Pedido</option><option value="peritaje">Peritaje</option><option value="factura">Factura</option><option value="documento">Otro documento</option></select><input id="upload-description" placeholder="Descripción opcional"><button id="upload-button" class="primary" type="button">Subir y asociar a la T</button><div id="upload-message" class="muted"></div></div>':'<div class="card muted">Modo lectura: puedes consultar y abrir todos los documentos, pero no adjuntar ni modificar.</div>')+'</section><section class="section"><h3>✉️ Correos</h3>'+(mails.length?mails.map(m=>'<div class="card"><strong>'+esc(m.asunto||'Correo')+'</strong><div class="muted">Para: '+esc((m.para||[]).join(', '))+(m.cc?.length?' · CC: '+esc(m.cc.join(', ')):'')+' · '+esc(m.estado||'')+' · '+esc(fmt(m.enviado_en||m.preparado_en))+'</div></div>').join(''):'<div class="muted">Sin envíos asociados.</div>')+'</section><section class="section"><h3>📝 Observaciones / diagnóstico</h3><div>'+esc(e.observaciones||'—')+'</div>'+(e.diagnostico_real?'<div style="margin-top:8px"><strong>Diagnóstico real:</strong> '+esc(e.diagnostico_real)+'</div>':'')+'</section>';
  document.querySelectorAll('.open-doc').forEach(button=>button.onclick=()=>openDocument(docs[Number(button.dataset.index)]));
  const upload=$('#upload-button');if(upload)upload.onclick=async()=>{const file=$('#upload-file').files?.[0],message=$('#upload-message');if(!file){message.textContent='Selecciona un archivo o foto.';return;}upload.disabled=true;message.textContent='Subiendo…';try{await api.uploadDocument({stageId:currentStageId,file,category:$('#upload-category').value,description:$('#upload-description').value,stopNumber:currentStopNumber});message.textContent='✓ Documento guardado en la T.';await loadDossier(currentStageId);}catch(error){message.textContent='Error: '+error.message;}finally{upload.disabled=false;}};
  modal.classList.add('open');
};

status.textContent='Cargando la pizarra actual…';
const {data:board,error:be}=await sb.from('pizarras').select('id,fecha').eq('estado','en_curso').order('fecha',{ascending:false}).limit(1).maybeSingle();
if(be||!board){status.className='card error';status.textContent='No se pudo cargar la pizarra: '+(be?.message||'sin pizarra en curso');throw be||new Error('Sin pizarra');}
const {data:rows,error:re}=await sb.from('registros_hotel').select('id,numero_parada,vehiculo_sustituido,matricula_sustituido,vehiculo_reserva,matricula_reserva,retirado_hotel_activo,etapas_hotel(id,nombre,posicion,estado,lugar,fecha_prevista,fecha_real)').eq('pizarra_id',board.id).eq('oculto',false).order('orden');
if(re){status.className='card error';status.textContent='No se pudieron cargar las T: '+re.message;throw re;}
const stages=[];(rows||[]).forEach(r=>(r.etapas_hotel||[]).sort((a,b)=>a.posicion-b.posicion).forEach(t=>stages.push({r,t})));
status.className='card ok';status.innerHTML='<strong>Pizarra '+esc(new Date(board.fecha+'T12:00:00').toLocaleDateString('es-ES'))+'</strong> · '+stages.length+' T visibles · '+(permissions.canEdit?'lector + editor':'solo lectura')+'<div class="muted">Pulsa una T para abrir el expediente. Los documentos se sirven con enlace privado temporal.</div>';
list.innerHTML=stages.map(({r,t})=>{const vehicle=r.vehiculo_sustituido||('Reserva '+(r.vehiculo_reserva||'—'));return '<article class="card stage"><div><span class="badge">'+esc((t.posicion||'?')+'T')+'</span> <strong>'+esc(vehicle)+'</strong> · '+esc(t.nombre||'Sin nombre')+'<div class="muted">Parada '+esc(r.numero_parada||'—')+' · '+esc(t.estado||'pendiente')+' · '+esc(t.lugar||'sin taller')+(r.retirado_hotel_activo?' · vehículo recuperado':'')+'</div></div><button class="primary open-t" data-id="'+esc(t.id)+'">Ver expediente T</button></article>'}).join('')||'<div class="card">No hay T en la pizarra actual.</div>';
document.querySelectorAll('.open-t').forEach(button=>button.onclick=async()=>{button.disabled=true;button.textContent='Cargando…';try{await loadDossier(button.dataset.id);}catch(error){alert('No se pudo abrir la T: '+error.message);}finally{button.disabled=false;button.textContent='Ver expediente T';}});
</script></body></html>
