<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metrogestión v39 · Expediente T</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:14px}.head{background:#075985;color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}.card{background:#fff;border:1px solid #d8e1ea;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 3px 14px rgba(15,23,42,.06)}button{font:inherit;border:1px solid #94a3b8;border-radius:10px;padding:10px 12px;background:#fff;font-weight:750;cursor:pointer}.primary{background:#075985;color:#fff;border-color:#075985}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800}.stage{display:flex;gap:10px;align-items:center;justify-content:space-between}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;z-index:1000;padding:12px;overflow:auto}.modal.open{display:block}.sheet{max-width:820px;margin:2vh auto;background:white;border-radius:16px;padding:16px}.section{border-top:1px solid #e2e8f0;padding-top:12px;margin-top:12px}.doc{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0}.photo{max-width:130px;max-height:100px;border-radius:8px;object-fit:cover}.error{background:#fff1f2;border-color:#ef4444;color:#991b1b}@media(max-width:650px){.grid{grid-template-columns:1fr}.stage{align-items:flex-start;flex-direction:column}.stage button{width:100%}}
</style>
</head><body><main class="wrap">
<header class="head"><strong style="font-size:21px">🏨 Metrogestión v39 · Prueba expediente T</strong><div style="opacity:.85;margin-top:4px">Solo lectura · no modifica la v36 ni los datos.</div></header>
<div id="status" class="card">Comprobando sesión…</div><div id="list"></div>
</main><div id="modal" class="modal"><div class="sheet"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><strong id="modal-title" style="font-size:21px">Expediente T</strong><div id="modal-sub" class="muted"></div></div><button id="close">Cerrar</button></div><div id="dossier"></div></div></div>
<script>
(async()=>{
const url='https://njtohfkqjjoavtumtmza.supabase.co';
const key='sb_publishable_w1a9DClOM0S4HVJdv_TbKg_W_UkN2W_';
const sb=supabase.createClient(url,key);
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString('es-ES',{timeZone:'Europe/Madrid'}):'—';
const status=$('#status'),list=$('#list'),modal=$('#modal'),dossier=$('#dossier');
$('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
const {data:{session}}=await sb.auth.getSession();
if(!session){status.className='card error';status.innerHTML='<strong>Sin sesión Supabase activa.</strong><div class="muted">Abre primero Metrogestión e inicia sesión; después vuelve a esta prueba.</div>';return;}
status.textContent='Cargando la pizarra actual…';
const {data:board,error:be}=await sb.from('pizarras').select('id,fecha').eq('estado','en_curso').order('fecha',{ascending:false}).limit(1).maybeSingle();
if(be||!board){status.className='card error';status.textContent='No se pudo cargar la pizarra: '+(be?.message||'sin pizarra en curso');return;}
const {data:rows,error:re}=await sb.from('registros_hotel').select('id,numero_parada,vehiculo_sustituido,matricula_sustituido,vehiculo_reserva,matricula_reserva,retirado_hotel_activo,etapas_hotel(id,nombre,posicion,estado,lugar,fecha_prevista,fecha_real)').eq('pizarra_id',board.id).eq('oculto',false).order('orden');
if(re){status.className='card error';status.textContent='No se pudieron cargar las T: '+re.message;return;}
const stages=[];(rows||[]).forEach(r=>(r.etapas_hotel||[]).sort((a,b)=>a.posicion-b.posicion).forEach(t=>stages.push({r,t})));
status.innerHTML='<strong>Pizarra '+esc(new Date(board.fecha+'T12:00:00').toLocaleDateString('es-ES'))+'</strong> · '+stages.length+' T visibles<div class="muted">Pulsa cualquier T para abrir su expediente completo en modo lectura.</div>';
list.innerHTML=stages.map(({r,t})=>{const vehicle=r.vehiculo_sustituido||('Reserva '+(r.vehiculo_reserva||'—'));return '<article class="card stage"><div><span class="badge">'+esc((t.posicion||'?')+'T')+'</span> <strong>'+esc(vehicle)+'</strong> · '+esc(t.nombre||'Sin nombre')+'<div class="muted">Parada '+esc(r.numero_parada||'—')+' · '+esc(t.estado||'pendiente')+' · '+esc(t.lugar||'sin taller')+(r.retirado_hotel_activo?' · vehículo recuperado':'')+'</div></div><button class="primary open-t" data-id="'+esc(t.id)+'">Ver expediente T</button></article>'}).join('')||'<div class="card">No hay T en la pizarra actual.</div>';
const renderDocs=docs=>{if(!docs.length)return '<div class="muted">Sin documentos asociados.</div>';return docs.map(x=>{const isPhoto=String(x.mime_type||'').startsWith('image/');return '<div class="doc"><div>'+(isPhoto?'📷':'📄')+' <strong>'+esc(x.nombre_mostrado||x.nombre_original||'Documento')+'</strong><div class="muted">'+esc(x.categoria||'documento')+(x.subcategoria?' · '+esc(x.subcategoria):'')+' · '+esc(x.fecha_documento||'')+'</div></div>'+(isPhoto?'<span class="badge">Foto</span>':'<span class="badge">Archivo</span>')+'</div>'}).join('')};
const renderWorks=works=>works.length?works.map(w=>'<div class="card"><strong>'+esc(w.codigo||w.tipo||'Trabajo')+'</strong><div>'+esc(w.motivo_entrada||w.descripcion||'')+'</div>'+(w.diagnostico_real?'<div><strong>Diagnóstico:</strong> '+esc(w.diagnostico_real)+'</div>':'')+(w.expediente?'<div>Expediente: <strong>'+esc(w.expediente)+'</strong></div>':'')+(w.km||w.km_averia?'<div>Km: <strong>'+esc(w.km||w.km_averia)+'</strong></div>':'')+'</div>').join(''):'<div class="muted">Sin trabajos detallados.</div>';
for(const b of document.querySelectorAll('.open-t'))b.onclick=async()=>{b.disabled=true;b.textContent='Cargando…';const {data,error}=await sb.rpc('obtener_expediente_t_hotel',{p_etapa_id:b.dataset.id});b.disabled=false;b.textContent='Ver expediente T';if(error){alert('No se pudo abrir la T: '+error.message);return;}const e=data.etapa||{},p=data.parada||{},works=[...(data.trabajos||[]),...(data.trabajos_legacy||[])],orders=data.ordenes||[],mails=data.envios||[],docs=data.documentos||[];$('#modal-title').textContent=(e.posicion||'?')+'T · '+(e.nombre||'Etapa');$('#modal-sub').textContent='Parada '+(p.numero_parada||'—')+' · '+(p.vehiculo_sustituido||('Reserva '+(p.vehiculo_reserva||'—')));dossier.innerHTML='<div class="grid section"><div><span class="muted">Estado</span><br><strong>'+esc(e.estado||'—')+'</strong></div><div><span class="muted">Taller / centro</span><br><strong>'+esc(e.taller_nombre||e.lugar||'—')+'</strong>'+(e.centro_nombre?'<div>'+esc(e.centro_nombre)+'</div>':'')+'</div><div><span class="muted">Programada</span><br><strong>'+esc(fmt(e.fecha_prevista))+'</strong></div><div><span class="muted">Realizada</span><br><strong>'+esc(fmt(e.fecha_real||e.fecha_fin_real))+'</strong></div><div><span class="muted">UPC</span><br><strong>'+esc(p.upc||'—')+'</strong></div><div><span class="muted">INC</span><br><strong>'+esc(p.incidencia||'—')+'</strong></div></div><section class="section"><h3>🔧 Trabajos</h3>'+renderWorks(works)+'</section><section class="section"><h3>📄 Pedidos / OR</h3>'+(orders.length?orders.map(o=>'<div class="doc"><div>Pedido <strong>'+esc(o.numero_pedido||'—')+'</strong> · OR <strong>'+esc(o.numero_or||'—')+'</strong><div class="muted">'+esc(o.observaciones||'')+'</div></div></div>').join(''):'<div class="muted">Sin pedido u OR asociados.</div>')+'</section><section class="section"><h3>📷 Documentos y fotos</h3>'+renderDocs(docs)+'</section><section class="section"><h3>✉️ Correos</h3>'+(mails.length?mails.map(m=>'<div class="doc"><div><strong>'+esc(m.asunto||'Correo')+'</strong><div class="muted">Para: '+esc((m.para||[]).join(', '))+' · '+esc(m.estado||'')+' · '+esc(fmt(m.enviado_en||m.preparado_en))+'</div></div></div>').join(''):'<div class="muted">Sin envíos asociados.</div>')+'</section><section class="section"><h3>📝 Observaciones / diagnóstico</h3><div>'+esc(e.observaciones||'—')+'</div>'+(e.diagnostico_real?'<div style="margin-top:8px"><strong>Diagnóstico real:</strong> '+esc(e.diagnostico_real)+'</div>':'')+'</section>';modal.classList.add('open');};
})();
</script></body></html>
