<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Enlace Beta retirado · Metrogestión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
    main{width:min(100%,520px);background:white;border:1px solid #cbd5e1;border-radius:22px;padding:28px;box-shadow:0 18px 45px #0f172a1a}
    .badge{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:999px;padding:8px 12px;font-weight:800}
    h1{font-size:1.65rem;margin:18px 0 10px}p{font-size:1.05rem;line-height:1.55;margin:0 0 12px}
    .notice{margin-top:20px;padding:16px;border-radius:14px;background:#eff6ff;color:#1e3a8a;font-weight:650}
  </style>
</head>
<body>
  <main>
    <span class="badge">Enlace desactivado</span>
    <h1>Esta versión Beta ha sido retirada por seguridad</h1>
    <p>Este enlace de prueba ya no permite acceder a Metrogestión.</p>
    <p>Solicita al administrador el enlace oficial de <strong>Metrogestión Beta 2.0</strong>.</p>
    <div class="notice">No reutilices ni reenvíes esta dirección antigua.</div>
  </main>
</body>
</html>
