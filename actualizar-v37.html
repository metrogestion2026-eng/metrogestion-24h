<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar Metrogestión v37</title><style>body{font-family:system-ui,sans-serif;background:#f8fafc;color:#172033;margin:0;padding:24px}.card{max-width:520px;margin:40px auto;background:white;border:2px solid #075985;border-radius:16px;padding:22px;box-shadow:0 10px 30px #0002}button{width:100%;min-height:48px;border:0;border-radius:10px;background:#075985;color:white;font-weight:800;font-size:16px}#msg{margin:14px 0;line-height:1.5}</style></head><body><div class="card"><h2>Metrogestión · Actualización v37</h2><div id="msg">Preparando actualización segura…</div><button id="retry" hidden>Reintentar</button></div><script>(async()=>{const msg=document.getElementById('msg'),retry=document.getElementById('retry');async function run(){retry.hidden=true;try{if(!('serviceWorker'in navigator))throw new Error('Este navegador no admite actualización automática.');msg.textContent='Cerrando la versión anterior…';const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)await reg.unregister();if('caches'in window){for(const key of await caches.keys())await caches.delete(key);}msg.textContent='Instalando Metrogestión v37…';const reg=await navigator.serviceWorker.register('./sw-metrogestion-2-0.js?v=37',{updateViaCache:'none'});await reg.update();const worker=reg.installing||reg.waiting||reg.active;if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{const timer=setTimeout(resolve,8000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'){clearTimeout(timer);resolve();}if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('La instalación fue rechazada.'));}});});msg.textContent='✓ v37 instalada. Abriendo Metrogestión…';setTimeout(()=>location.replace('./metrogestion-2-0.html?v=37'),900);}catch(e){msg.textContent='No se pudo completar la actualización: '+e.message;retry.hidden=false;}}retry.addEventListener('click',run);run();})();</script></body></html>
